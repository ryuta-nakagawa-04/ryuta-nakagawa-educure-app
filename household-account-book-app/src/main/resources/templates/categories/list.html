<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カテゴリ一覧</title>
  <link rel="stylesheet" th:href="@{/css/categories.css}">
</head>
<body class="categories-page">

  <h1>カテゴリ一覧</h1>

  <div class="list-actions">
    <a th:href="@{/categories/new}">カテゴリを追加する</a>
  </div>

  <table class="category-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>カテゴリ名</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="c : ${categories}">
        <td th:text="${c.id}">1</td>
        <td th:text="${c.name}">食費</td>
        <td>
          <a th:href="@{|/categories/edit/${c.id}|}">編集</a> /
          <a th:href="@{|/categories/delete/${c.id}|}">削除</a>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="back-link">
    <a th:href="@{/settings}">設定画面に戻る</a>
  </div>

</body>
</html>
