<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カテゴリ追加</title>
  <link rel="stylesheet" th:href="@{/css/categories-common.css}">
</head>
<body class="category-page">

  <h1 class="page-title">カテゴリ追加</h1>

  <form th:action="@{/categories/new}"
        th:object="${form}"
        method="post"
        class="category-form">

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="form-group">
      <label for="name" class="form-label">追加するカテゴリ</label>
      <input id="name"
             type="text"
             th:field="*{name}"
             placeholder="例：食費"
             class="form-input">
      <div class="error-text"
           th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}"></div>
    </div>

    <div class="button-col">
      <button type="submit" class="btn-primary">追加する</button>
      <a th:href="@{/settings}" class="btn-outline">設定画面に戻る</a>
    </div>
  </form>

</body>
</html>
