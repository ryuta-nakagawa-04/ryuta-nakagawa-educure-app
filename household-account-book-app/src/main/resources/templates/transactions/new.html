<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="utf-8">
  <title>収支入力</title>
  <link rel="stylesheet" th:href="@{/css/transactions-new.css}">
</head>
<body class="page-new">
  <div class="form-card">
    <h1>収支入力</h1>

    <form th:action="@{/transactions}" method="post" th:object="${form}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <!-- 区分（支出/収入） -->
      <div class="form-group">
        <label class="form-label">区分</label>

        <div class="direction-row">
          <label class="direction-option">
            <input type="radio" th:field="*{direction}" value="OUT">
            <span>支出</span>
          </label>

          <label class="direction-option">
            <input type="radio" th:field="*{direction}" value="IN">
            <span>収入</span>
          </label>
        </div>

        <div class="error-text"
            th:if="${#fields.hasErrors('direction')}"
            th:errors="*{direction}">
        </div>
      </div>

      <!-- 日付 -->
      <label for="txnDate">日付</label>
      <input id="txnDate" type="date" th:field="*{txnDate}" placeholder="yyyy-mm-dd">
      <div class="error-text" th:if="${#fields.hasErrors('txnDate')}" th:errors="*{txnDate}"></div>

      <!-- カテゴリ -->
      <label for="categoryId">カテゴリ</label>
      <select id="categoryId" th:field="*{categoryId}">
        <option value="" disabled selected>選択してください</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <div class="error-text" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>

      <!-- メモ -->
      <label for="memo">メモ</label>
      <input id="memo" type="text" th:field="*{memo}" placeholder="メモを入力">
      <div class="error-text" th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}"></div>

      <!-- 金額 -->
      <label for="amount">金額</label>
      <input id="amount" type="number" th:field="*{amount}" placeholder="半角数字で入力">
      <div class="error-text" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>

      <!-- ボタン -->
      <button type="submit" class="btn btn-primary">登録する</button>
      <a th:href="@{/transactions}" class="btn btn-outline-sky">収支一覧画面に戻る</a>
    </form>
  </div>
</body>
</html>
