<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パスワードの再設定</title>
  <link rel="stylesheet" th:href="@{/css/password-change.css}">
</head>
<body class="password-page">

  <h1 class="page-title">パスワードの再設定</h1>

  <!-- 入力フォーム（成功時以外に表示） -->
  <div th:if="${success == null}" class="form-wrapper">

    <form th:action="@{/users/password-change}" th:object="${form}" method="post" class="password-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <!-- 新しいパスワード -->
      <div class="form-group">
        <label for="next" class="form-label">新しいパスワード</label>
        <input type="password"
               id="next"
               th:field="*{next}"
               placeholder="6〜100文字"
               class="form-input">
        <div th:if="${#fields.hasErrors('next')}" th:errors="*{next}" class="error-text"></div>
      </div>

      <!-- 確認用 -->
      <div class="form-group">
        <label for="confirm" class="form-label">パスワード確認用</label>
        <input type="password"
               id="confirm"
               th:field="*{confirm}"
               placeholder="確認用パスワード"
               class="form-input">
        <div th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}" class="error-text"></div>
      </div>

      <!-- ボタン行 -->
      <div class="button-row">
        <button type="submit" class="btn-primary">再設定する</button>
        <a th:href="@{/settings}" class="btn-outline">設定画面に戻る</a>
      </div>

    </form>

  </div>

</body>
</html>
