<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パスワード再設定</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <div class="login-container">
    <h1>パスワード再設定</h1>

    <!-- 成功メッセージ -->
    <div th:if="${success}">
      <p>パスワードを再設定しました。</p>
      <a th:href="@{/login}" class="back-btn">ログイン画面へ戻る</a>
    </div>

    <!-- 入力フォーム（成功時は非表示） -->
    <div th:if="${success == null}">
      <form th:action="@{/password-reset}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 1) ユーザーID（常に表示） -->
        <label for="userName">ユーザーID</label>
        <input type="text" id="userName" th:field="*{userName}" placeholder="ユーザーID" required>
        <div th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></div>

        <!-- 2) 新しいパスワード -->
        <label for="newPassword">新しいパスワード</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" placeholder="6〜100文字" required>
        <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>

        <!-- 3) 確認用パスワード -->
        <label for="confirm">確認用パスワード</label>
        <input type="password" id="confirm" th:field="*{confirm}" placeholder="もう一度入力" required>
        <div th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}"></div>

        <button type="submit">再設定する</button>
      </form>

      <!-- リンク風ボタンでログイン画面へ -->
      <a th:href="@{/login}" class="back-btn">ログイン画面へ戻る</a>
    </div>
  </div>
</body>
</html>
