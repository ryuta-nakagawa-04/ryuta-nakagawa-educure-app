<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <!-- CSSファイルを読み込む -->
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
  <div class="login-container">
    <h1>ログイン</h1>

    <!-- ログイン失敗時のメッセージ -->
    <div th:if="${param.error}" class="alert error">ログインIDもしくはパスワードが違います。</div>
    <!-- ログアウト時のメッセージ -->
    <div th:if="${param.logout}" class="alert info">ログアウトしました。</div>
    <!-- パスワード変更成功メッセージ -->
    <div th:if="${param.changed}" class="alert info">パスワードを変更しました。</div>
    <!-- 新規登録 完了メッセージ -->
    <div th:if="${param.signup}" class="alert success">新規登録が完了しました。</div>

    <!-- ログインフォーム -->
    <form th:action="@{/login}" method="post">
      <label for="username">ユーザーID</label>
      <input type="text" id="username" name="username" placeholder="ユーザーID" required>

      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" placeholder="パスワード" required>

      <!-- パスワードをお忘れの方リンク -->
      <div class="links">
        <a th:href="@{/password-reset}">パスワードをお忘れの方はこちら</a>
      </div>
    
      <!-- CSRFトークン -->
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <button type="submit">ログインする</button>
    </form>

    <!-- 新規登録ボタン -->
    <a th:href="@{/users/signup}" class="register-btn">新規登録</a>
  </div>
</body>
</html>
